spring.application.name=Trivz
spring.datasource.url=jdbc:mysql://localhost:3306/trivz
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8080
server.address=0.0.0.0

# Project brief: virtual threads for WebSocket / Tomcat handlers
spring.threads.virtual.enabled=true

jwt.secret=REPLACE_WITH_A_LONG_RANDOM_SECRET_KEY_32+_CHARS
jwt.expirationMs=86400000
